<title id="title">Chess Grande website architecture</title>
<desc id="desc">Families and staff use a shared WordPress application. Custom modules manage bookings, tournaments, meetups, assessment and merchandise. WordPress content and domain tables share a database. Stripe, HitPay and email provide external integrations. This is a conceptual map of the local implementation, not a production deployment inventory.</desc>
